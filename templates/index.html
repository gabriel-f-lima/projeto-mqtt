<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Monitor de distancia</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
	<main class="dashboard">
		<header class="page-header">
			<div>
				<p class="eyebrow">SENSOR MQTT</p>
				<h1>Monitor de distancia</h1>
				<p class="subtitle">Leituras recentes recebidas pelo sistema.</p>
			</div>
			<button id="refresh-button" class="refresh-button" type="button">Atualizar</button>
		</header>

		<section class="summary" aria-label="Resumo das leituras">
			<article class="summary-item">
				<span>Total exibido</span>
				<strong id="reading-count">-</strong>
			</article>
			<article class="summary-item">
				<span>Ultima distancia</span>
				<strong id="latest-distance">-</strong>
			</article>
			<article class="summary-item">
				<span>Status</span>
				<strong id="connection-status" class="status status-loading">Carregando</strong>
			</article>
		</section>

		<section class="readings-panel" aria-labelledby="readings-title">
			<div class="panel-header">
				<div>
					<p class="eyebrow">HISTORICO</p>
					<h2 id="readings-title">Ultimas leituras</h2>
				</div>
				<span id="last-updated" class="last-updated">Aguardando dados</span>
			</div>

			<p id="feedback" class="feedback" role="status"></p>
			<div class="table-wrapper">
				<table>
					<thead>
						<tr>
							<th>Dispositivo</th>
							<th>Distancia</th>
							<th>Detectado</th>
							<th>Data e hora</th>
						</tr>
					</thead>
					<tbody id="readings-body">
						<tr><td colspan="4" class="empty-state">Carregando leituras...</td></tr>
					</tbody>
				</table>
			</div>
		</section>
	</main>
	<script src="{{ url_for('static', filename='js/index.js') }}"></script>
</body>
</html>
